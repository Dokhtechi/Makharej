name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test & Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional environment & Firebase config
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
            echo "Loaded .env from GitHub Secrets."
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Loaded app/google-services.json from GitHub Secrets."
          elif [ -f app/google-services.json ]; then
            echo "Using repository app/google-services.json."
          else
            echo "app/google-services.json not found; continuing with passthrough mode."
          fi

      - name: Prepare Debug Keystore
        run: |
          if [ -s debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore (Production Secret or CI Test Key)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_MODE=production" >> "$GITHUB_ENV"
            echo "Using production upload keystore from GitHub Secrets."
          else
            TEMP_PASS="androidCiTempPass2026"
            echo "::add-mask::$TEMP_PASS"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -keystore "$KEYSTORE_FILE" \
              -storepass "$TEMP_PASS" -alias upload -keypass "$TEMP_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Hazineh CI Release,O=Hazineh,C=IR"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TEMP_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_MODE=ci-test-signed" >> "$GITHUB_ENV"
            echo "Generated temporary CI signing keystore for installable Release APK."
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Summarize build outputs
        run: |
          echo "### Android Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Signing Mode:** \`${RELEASE_SIGNING_MODE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug APK:**" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/*.apk | awk '{print "  - `" $9 "` (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release APK:**" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/release/*.apk | awk '{print "  - `" $9 "` (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hazineh-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hazineh-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Unit Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
